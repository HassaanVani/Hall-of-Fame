<style>
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .animate-spin-slow {
      animation: spin-slow linear infinite;
    }
    .animate-spin-reverse {
      animation: spin-reverse linear infinite;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .rotate-x-12 { transform: rotateX(12deg); }
    .rotate-y-12 { transform: rotateY(12deg); }
    .rotate-x-45 { transform: rotateX(60deg) rotateY(20deg); } /* Gives the 3D tilted ring effect */
  </style>
<script>
    // 3D Parallax effect for the convergence logo
    const logo = document.getElementById('convergence-logo');
    
    document.addEventListener('mousemove', (e) => {
      if(!logo) return;
      const rect = logo.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      
      // Calculate rotation based on mouse position
      const rotateX = (y / rect.height) * -30; // Max 15 deg tilt
      const rotateY = (x / rect.width) * 30;
      
      // Apply transform to inner container (assuming the first child is the container)
      const container = logo.querySelector('.transform-gpu');
      if(container) {
          container.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }
    });

    document.addEventListener('mouseleave', () => {
       if(!logo) return;
       const container = logo.querySelector('.transform-gpu');
       if(container) {
           container.style.transform = `rotateX(0deg) rotateY(0deg)`;
       }
    });
  </script>
