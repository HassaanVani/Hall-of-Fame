<style>
    @keyframes heartbeat {
      0% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255,255,255,0.1)); }
      14% { transform: scale(1.02); filter: drop-shadow(0 0 40px rgba(255,255,255,0.3)); }
      28% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255,255,255,0.1)); }
      42% { transform: scale(1.02); filter: drop-shadow(0 0 30px rgba(255,255,255,0.2)); }
      70% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255,255,255,0.1)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255,255,255,0.1)); }
    }
    
    @keyframes scroll-indicator {
      0% { transform: translateY(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(200%); opacity: 0; }
    }

    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes glitch-1 {
      0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
      20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
      40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
      60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
      80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
      100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
    }

    @keyframes glitch-2 {
      0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); }
      20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 1px); }
      40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, -2px); }
      60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 2px); }
      80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); }
      100% { clip-path: inset(5% 0 80% 0); transform: translate(-1px, 1px); }
    }

    .animate-heartbeat { animation: heartbeat 2s ease-in-out infinite; }
    .animate-scroll-indicator { animation: scroll-indicator 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    .animate-fade-in-up { animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .animate-glitch-1 { animation: glitch-1 0.2s linear infinite; }
    .animate-glitch-2 { animation: glitch-2 0.2s linear infinite reverse; }
    
    .text-shadow-neon {
      text-shadow: 0 0 10px rgba(255,255,255,0.2), 0 0 20px rgba(255,255,255,0.1);
    }
  </style>
<script>
    // Parallax effect on mouse move for the background glows
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      
      const glows = document.querySelectorAll('.rounded-full.blur-\\[120px\\], .rounded-full.blur-\\[80px\\]');
      glows.forEach((glow, index) => {
        const factor = index === 0 ? 1 : -1.5;
        glow.style.transform = `translate(calc(-50% + ${x * factor}px), calc(-50% + ${y * factor}px))`;
      });
    });
  </script>
