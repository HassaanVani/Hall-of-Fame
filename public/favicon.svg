<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glowing filters -->
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="h-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FF3131" />
    </linearGradient>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#CCFF00" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#050505" />
  <rect width="512" height="512" rx="108" fill="url(#bg-glow)" />

  <!-- Outer Crimson Orbit -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FF3131" stroke-width="7" filter="url(#glow-crimson)" opacity="0.9" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FF3131" stroke-width="2" opacity="0.6" stroke-dasharray="14 10 40 8 90 12" />

  <!-- Middle Cyan Orbit -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00F0FF" stroke-width="6" filter="url(#glow-cyan)" opacity="0.85" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.5" stroke-dasharray="80 15 30 15" />

  <!-- Inner Electric Lime Orbit -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#CCFF00" stroke-width="6" filter="url(#glow-lime)" opacity="0.9" />

  <!-- Orbit Signal Nodes (Dots) -->
  <circle cx="256" cy="46" r="7" fill="#FF3131" filter="url(#glow-crimson)" />
  <circle cx="426" cy="256" r="6" fill="#00F0FF" filter="url(#glow-cyan)" />
  <circle cx="256" cy="426" r="7" fill="#FF3131" filter="url(#glow-crimson)" />
  <circle cx="86" cy="256" r="6" fill="#00F0FF" filter="url(#glow-cyan)" />

  <circle cx="349" cy="163" r="5" fill="#CCFF00" filter="url(#glow-lime)" />
  <circle cx="163" cy="349" r="5" fill="#CCFF00" filter="url(#glow-lime)" />

  <!-- Central Monogram 'H' -->
  <g transform="translate(256, 256)">
    <!-- Left Pillar -->
    <path d="M -64,-80 L -24,-80 L -24,80 L -64,80 Z" fill="#CCFF00" filter="url(#glow-lime)" />
    <!-- Right Pillar -->
    <path d="M 24,-80 L 64,-80 L 64,80 L 24,80 Z" fill="#FF3131" filter="url(#glow-crimson)" />
    <!-- Crossbar with Angled High-Tech Cutouts -->
    <path d="M -24,-18 L 24,-18 L 24,18 L -24,18 Z" fill="url(#h-grad)" />
    <!-- Inner Accent Line -->
    <path d="M -18,0 L 18,0" stroke="#050505" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
